name: sembast_sqflite_flutter_test
description: sembast sqflite test
version: 0.2.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  sqflite: ">=2.4.3"
  sembast: ">=3.8.8"
  sqlite3_flutter_libs: ">=0.6.0+eol"
  sembast_sqflite: ">=2.2.2"
  sembast_sqflite_common_test:
    git:
      url: https://github.com/tekartik/sembast_sqflite
      path: sembast_sqflite_common_test
    version: '>=0.1.0'
  sembast_test:
    git:
      url: https://github.com/tekartik/sembast.dart
      path: sembast_test
    version: '>=0.1.3'
  # The design widgets, as the tekartik flutter packages use them.
  material_ui: ">=1.5.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  sqflite_common_ffi: ">=2.4.1"
  test: ">=1.31.0"
  process_run: ">=1.3.4"
  build_runner: ">=2.15.0"
  build_web_compilers: ">=4.7.0"
  build_test: ">=3.5.13"
  tekartik_lints_flutter:
    git:
      url: https://github.com/tekartik/common_flutter.dart
      path: packages/lints_flutter
    version: '>=0.1.0'
dependency_overrides:
  sembast_sqflite:
    path: ../sembast_sqflite
  sembast_sqflite_common_test:
    path: ../sembast_sqflite_common_test
